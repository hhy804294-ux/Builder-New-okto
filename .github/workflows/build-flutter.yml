name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: "Job ID"
        required: false
        type: string
      userId:
        description: "User ID"
        required: false
        type: string
        default: "0"
      payload:
        description: "Payload JSON"
        required: false
        type: string

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JOB_ID: ${{ inputs.jobId }}
      PAYLOAD: ${{ inputs.payload }}
      GH_TOKEN_DL: ${{ github.token }}

    steps:
      - name: Validasi & baca payload
        id: cfg
        shell: bash
        run: |
          set -euo pipefail
          if ! echo "$PAYLOAD" | jq -e . > /dev/null 2>&1; then
            echo "::error::Payload JSON tidak valid"
            exit 1
          fi

          MODE=$(echo "$PAYLOAD"       | jq -r '.mode // "zip"')
          URL=$(echo "$PAYLOAD"        | jq -r '.url // empty')
          BUILD_TYPE=$(echo "$PAYLOAD" | jq -r '.buildType // "release"')
          PERF=$(echo "$PAYLOAD"       | jq -r '.perfMode // "fast"')
          TAG=$(echo "$PAYLOAD"        | jq -r '.tag // empty')

          if [ "$MODE" != "zip" ]; then
            echo "::error::Mode '$MODE' tidak didukung di workflow ini"
            exit 1
          fi
          if [ -z "$URL" ]; then
            echo "::error::URL ZIP kosong"
            exit 1
          fi

          {
            echo "ZIP_URL=$URL"
            echo "BUILD_TYPE=$BUILD_TYPE"
            echo "PERF_MODE=$PERF"
            echo "BUILD_TAG=$TAG"
          } >> "$GITHUB_ENV"

          echo "Build type : $BUILD_TYPE"
          echo "Perf mode  : $PERF"
          echo "Tag        : $TAG"

      - name: Download ZIP project
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer $GH_TOKEN_DL" \
            -o "$RUNNER_TEMP/project.zip" "$ZIP_URL"
          SIZE=$(stat -c%s "$RUNNER_TEMP/project.zip")
          echo "ZIP size: $SIZE bytes"
          if [ "$SIZE" -lt 100 ]; then
            echo "::error::ZIP terlalu kecil / download gagal"
            exit 1
          fi

      - name: Extract & cari pubspec.yaml
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/app"
          mkdir -p "$GITHUB_WORKSPACE/app"
          unzip -q "$RUNNER_TEMP/project.zip" -d "$GITHUB_WORKSPACE/app"

          PUBSPEC=$(find "$GITHUB_WORKSPACE/app" -name pubspec.yaml -not -path "*/build/*" | head -n 1)
          if [ -z "$PUBSPEC" ]; then
            echo "::error::pubspec.yaml tidak ditemukan di dalam ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project ditemukan di: $PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          flutter --version
          flutter pub get

      - name: Build APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "$BUILD_TYPE" = "debug" ]; then
            ARGS+=(--debug)
          else
            ARGS+=(--release)
          fi
          if [ "$PERF_MODE" = "low" ]; then
            ARGS+=(--split-per-abi)
          fi
          echo "flutter build apk ${ARGS[*]}"
          flutter build apk "${ARGS[@]}"

      - name: Kumpulkan APK
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out"
          rm -rf "$OUT" && mkdir -p "$OUT"
          find "$PROJECT_DIR/build/app/outputs" -name "*.apk" -exec cp {} "$OUT/" \;
          COUNT=$(find "$OUT" -name "*.apk" | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Build selesai tapi tidak ada file .apk"
            exit 1
          fi
          ls -lh "$OUT"

      - name: Upload artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: build-apk-${{ github.run_id }}
          path: out/*.apk
          retention-days: 1
          if-no-files-found: error
